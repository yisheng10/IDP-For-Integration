services:
  - type: web
    name: triallight-epro
    runtime: node
    rootDir: "li qiu's part questionnaire ePRO"
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: triallight-dropout
    runtime: python
    rootDir: "Patient-Dropout-Prediction"
    buildCommand: pip install -r requirements.txt
    startCommand: python src/http_service.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DROPOUT_DATA_PATH
        value: deploy_assets/data/triallight_dropout_testing.csv
      - key: DROPOUT_CHECKPOINTS_DIR
        value: deploy_assets/checkpoints
