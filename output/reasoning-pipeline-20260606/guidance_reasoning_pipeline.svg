<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">TrialLight Guidance Reasoning and Traceability Pipeline</title>
  <desc id="desc">Diagram showing frontend context loading and routing, server-side structured reasoning trace generation, final answer generation, live event streaming, Firestore persistence, and history review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31465a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18764b"/>
    </marker>
    <style>
      .bg { fill: #f5f7f9; }
      .title { font: 700 30px Arial, sans-serif; fill: #132b3d; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #526879; }
      .lane { fill: #ffffff; stroke: #c9d3dc; stroke-width: 1.5; rx: 8; }
      .laneTitle { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .laneFront { fill: #1769aa; }
      .laneServer { fill: #75520f; }
      .laneData { fill: #18764b; }
      .box { fill: #ffffff; stroke: #8fa2b2; stroke-width: 1.6; rx: 7; }
      .boxBlue { fill: #edf6fc; stroke: #4695c7; stroke-width: 1.8; rx: 7; }
      .boxAmber { fill: #fff7e6; stroke: #c89231; stroke-width: 1.8; rx: 7; }
      .boxGreen { fill: #edf8f2; stroke: #3d9b70; stroke-width: 1.8; rx: 7; }
      .boxRed { fill: #fff2f1; stroke: #cc6258; stroke-width: 1.8; rx: 7; }
      .boxDark { fill: #233f54; stroke: #233f54; stroke-width: 1.8; rx: 7; }
      .boxTitle { font: 700 15px Arial, sans-serif; fill: #163247; }
      .boxTitleLight { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .body { font: 400 12px Arial, sans-serif; fill: #3c5365; }
      .bodyLight { font: 400 12px Arial, sans-serif; fill: #eaf2f7; }
      .code { font: 400 11px "Courier New", monospace; fill: #385268; }
      .small { font: 400 11px Arial, sans-serif; fill: #607686; }
      .badge { font: 700 10px Arial, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #31465a; stroke-width: 2; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #1769aa; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .arrowGreen { fill: none; stroke: #18764b; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .dash { stroke-dasharray: 7 6; }
      .note { fill: #fffdf8; stroke: #c89231; stroke-width: 1.5; rx: 7; }
      .noteTitle { font: 700 13px Arial, sans-serif; fill: #75520f; }
      .noteText { font: 400 12px Arial, sans-serif; fill: #614c22; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>

  <text class="title" x="60" y="52">TrialLight Guidance Reasoning and Traceability Pipeline</text>
  <text class="subtitle" x="60" y="80">CRC/patient guidance flow: route and retrieve, generate an audit-friendly explanation trace, produce the final answer, stream events, and persist patient-linked records.</text>

  <rect class="lane" x="40" y="110" width="1520" height="245"/>
  <rect class="laneFront" x="40" y="110" width="1520" height="34" rx="8"/>
  <rect class="laneFront" x="40" y="132" width="1520" height="12"/>
  <text class="laneTitle" x="60" y="133">1. Browser / Frontend Orchestration</text>

  <rect class="boxBlue" x="70" y="178" width="205" height="120"/>
  <text class="boxTitle" x="88" y="205">User Sends Message</text>
  <text class="body" x="88" y="230">Save user turn and identify</text>
  <text class="body" x="88" y="248">active patient / protocol.</text>
  <text class="code" x="88" y="275">GeminiChatbot.handleSend()</text>

  <rect class="boxBlue" x="330" y="178" width="230" height="120"/>
  <text class="boxTitle" x="348" y="205">Load Prompt Context</text>
  <text class="body" x="348" y="230">Workspace, patient, vitals,</text>
  <text class="body" x="348" y="248">incidents, protocol scope.</text>
  <text class="code" x="348" y="275">loadPatientPromptContext()</text>

  <rect class="boxBlue" x="615" y="164" width="290" height="148"/>
  <text class="boxTitle" x="633" y="191">Route Guidance Request</text>
  <text class="body" x="633" y="216">Hard rules, cache eligibility, then</text>
  <text class="body" x="633" y="234">router model if needed.</text>
  <rect x="633" y="251" width="56" height="21" rx="5" fill="#788995"/>
  <rect x="697" y="251" width="72" height="21" rx="5" fill="#1769aa"/>
  <rect x="777" y="251" width="100" height="21" rx="5" fill="#18764b"/>
  <text class="badge" x="646" y="265">SKIP</text>
  <text class="badge" x="709" y="265">RETRIEVE</text>
  <text class="badge" x="789" y="265">REUSE CACHE</text>
  <text class="code" x="633" y="294">routeGuidanceRequest()</text>

  <rect class="boxBlue" x="960" y="164" width="265" height="148"/>
  <text class="boxTitle" x="978" y="191">Routing Result</text>
  <text class="code" x="978" y="216">routedPrompt</text>
  <text class="code" x="978" y="234">routeDecision / routeReason</text>
  <text class="code" x="978" y="252">sourceMask / usedCache</text>
  <text class="code" x="978" y="270">ctcaeChunks / protocolChunks</text>
  <text class="body" x="978" y="294">All evidence inputs are explicit.</text>

  <rect class="boxDark" x="1280" y="178" width="220" height="120"/>
  <text class="boxTitleLight" x="1298" y="205">Start Trace Stream</text>
  <text class="bodyLight" x="1298" y="230">POST complete trace payload</text>
  <text class="bodyLight" x="1298" y="248">to Firebase HTTP function.</text>
  <text class="code" x="1298" y="275" fill="#eaf2f7">TraceStreamHttp</text>

  <path class="arrowBlue" d="M275 238 H330"/>
  <path class="arrowBlue" d="M560 238 H615"/>
  <path class="arrowBlue" d="M905 238 H960"/>
  <path class="arrowBlue" d="M1225 238 H1280"/>

  <rect class="lane" x="40" y="385" width="1520" height="495"/>
  <rect class="laneServer" x="40" y="385" width="1520" height="34" rx="8"/>
  <rect class="laneServer" x="40" y="407" width="1520" height="12"/>
  <text class="laneTitle" x="60" y="408">2. Firebase Guidance Trace Runtime</text>

  <rect class="boxAmber" x="70" y="452" width="230" height="130"/>
  <text class="boxTitle" x="88" y="479">Authenticate + Normalize</text>
  <text class="body" x="88" y="504">Resolve CRC/patient audience,</text>
  <text class="body" x="88" y="522">traceId, sessionId, subjectId,</text>
  <text class="body" x="88" y="540">patient linkage and sourceMask.</text>
  <text class="code" x="88" y="565">normalizeGuidanceTracePayload()</text>

  <rect class="boxAmber" x="355" y="452" width="280" height="130"/>
  <text class="boxTitle" x="373" y="479">Create Structured Trace Prompt</text>
  <text class="body" x="373" y="504">Question + patient context + route</text>
  <text class="body" x="373" y="522">decision + retrieved excerpts.</text>
  <text class="body" x="373" y="540">Requests audit-friendly JSON.</text>
  <text class="code" x="373" y="565">buildGuidanceReasoningTracePrompt()</text>

  <rect class="boxRed" x="690" y="442" width="300" height="150"/>
  <text class="boxTitle" x="708" y="469">Guidance Model Call A</text>
  <text class="body" x="708" y="494">Generate structured explanation trace:</text>
  <text class="code" x="708" y="516">observed_signals</text>
  <text class="code" x="708" y="534">retrieved_evidence / risk_interpretation</text>
  <text class="code" x="708" y="552">why_this_action / what_would_change</text>
  <text class="code" x="708" y="574">display_summary</text>

  <rect class="boxAmber" x="1045" y="452" width="260" height="130"/>
  <text class="boxTitle" x="1063" y="479">Normalize + Build Events</text>
  <text class="body" x="1063" y="504">Convert JSON sections and retrieved</text>
  <text class="body" x="1063" y="522">chunks into reviewable trace events.</text>
  <text class="body" x="1063" y="540">Fallback summary on model failure.</text>
  <text class="code" x="1063" y="565">emitTraceEvent()</text>

  <rect class="boxDark" x="1360" y="452" width="150" height="130"/>
  <text class="boxTitleLight" x="1378" y="479">Live NDJSON</text>
  <text class="bodyLight" x="1378" y="504">trace_event</text>
  <text class="bodyLight" x="1378" y="522">final_answer</text>
  <text class="bodyLight" x="1378" y="540">trace_complete</text>
  <text class="bodyLight" x="1378" y="558">trace_error</text>

  <path class="arrow" d="M300 517 H355"/>
  <path class="arrow" d="M635 517 H690"/>
  <path class="arrow" d="M990 517 H1045"/>
  <path class="arrow dash" d="M1305 517 H1360"/>

  <rect class="note" x="690" y="620" width="300" height="84"/>
  <text class="noteTitle" x="708" y="646">Traceability Boundary</text>
  <text class="noteText" x="708" y="668">This is not private chain-of-thought.</text>
  <text class="noteText" x="708" y="686">It is a separate evidence-backed explanation artifact.</text>
  <path class="arrow dash" d="M840 592 V620"/>

  <rect class="boxAmber" x="355" y="738" width="280" height="108"/>
  <text class="boxTitle" x="373" y="765">Build Grounded Answer Input</text>
  <text class="body" x="373" y="790">Wrap route metadata and authoritative</text>
  <text class="body" x="373" y="808">CTCAE/protocol excerpts when present.</text>
  <text class="code" x="373" y="830">buildGroundedGuidanceUserMessage()</text>

  <rect class="boxRed" x="690" y="728" width="300" height="128"/>
  <text class="boxTitle" x="708" y="755">Guidance Model Call B</text>
  <text class="body" x="708" y="780">Generate the final user-facing answer.</text>
  <text class="body" x="708" y="798">Uses grounded evidence rules and must</text>
  <text class="body" x="708" y="816">not invent citations or page numbers.</text>
  <text class="code" x="708" y="840">runSideEffectGuidanceChat()</text>

  <rect class="boxAmber" x="1045" y="738" width="260" height="108"/>
  <text class="boxTitle" x="1063" y="765">Finalize Trace Summary</text>
  <text class="body" x="1063" y="790">Attach answer, provider/model, source</text>
  <text class="body" x="1063" y="808">mask, completion status and summary.</text>
  <text class="code" x="1063" y="830">traceSummary</text>

  <path class="arrow" d="M495 582 V738"/>
  <path class="arrow" d="M635 792 H690"/>
  <path class="arrow" d="M990 792 H1045"/>
  <path class="arrow dash" d="M1175 738 V582"/>

  <rect class="lane" x="40" y="910" width="1520" height="170"/>
  <rect class="laneData" x="40" y="910" width="1520" height="34" rx="8"/>
  <rect class="laneData" x="40" y="932" width="1520" height="12"/>
  <text class="laneTitle" x="60" y="933">3. Persistence, Live UI, and Historical Review</text>

  <rect class="boxGreen" x="80" y="970" width="300" height="78"/>
  <text class="boxTitle" x="98" y="997">Live Reasoning Panel</text>
  <text class="body" x="98" y="1020">Frontend renders streamed events and final answer.</text>
  <text class="code" x="98" y="1038">GeminiChatbot activeTrace</text>

  <rect class="boxGreen" x="485" y="960" width="370" height="98"/>
  <text class="boxTitle" x="503" y="987">Firestore Patient-Linked Trace</text>
  <text class="code" x="503" y="1010">users/{patientUid}/guidance_traces/{traceId}</text>
  <text class="code" x="503" y="1028">users/{patientUid}/guidance_traces/{traceId}/events/{seq}</text>
  <text class="body" x="503" y="1047">Only persisted when a patientUid is linked.</text>

  <rect class="boxGreen" x="960" y="970" width="260" height="78"/>
  <text class="boxTitle" x="978" y="997">AI Message Reference</text>
  <text class="body" x="978" y="1020">Saved message carries traceId, patientUid,</text>
  <text class="body" x="978" y="1038">sourceMask and persistence status.</text>

  <rect class="boxGreen" x="1325" y="960" width="205" height="98"/>
  <text class="boxTitle" x="1343" y="987">Historical Review</text>
  <text class="body" x="1343" y="1010">CRC guidance history and</text>
  <text class="body" x="1343" y="1028">patient-safe timeline load</text>
  <text class="body" x="1343" y="1046">bounded event queries.</text>

  <path class="arrowBlue dash" d="M1435 582 V900 H230 V970"/>
  <path class="arrowGreen" d="M1175 846 V895 H670 V960"/>
  <path class="arrowGreen" d="M855 1009 H960"/>
  <path class="arrowGreen" d="M1220 1009 H1325"/>

  <text class="small" x="60" y="1100">Key property: route metadata, source excerpts, explanation events, final answer, provider/model, and patient linkage remain connected by traceId/sessionId.</text>
</svg>
