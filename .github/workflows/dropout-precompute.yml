name: TrialLight Dropout Precompute

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Kuala_Lumpur = 22:00 UTC on the previous day.
    - cron: "0 22 * * *"
    # 18:00 Asia/Kuala_Lumpur = 10:00 UTC on the same day.
    - cron: "0 10 * * *"

jobs:
  publish-dropout-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DROPOUT_REPO_PAT: ${{ secrets.DROPOUT_REPO_PAT }}
      TRIALLIGHT_SUBJECT_CONTEXT_REGISTRY_PATH: deploy_assets/data/triallight_subject_context_registry_v35subjectid.csv
      DROPOUT_CHECKPOINTS_DIR: deploy_assets/checkpoints_candidate_024
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Normalize submodule metadata for checkout cleanup
        shell: bash
        run: |
          cat > .gitmodules <<'EOF'
          [submodule "Patient-Dropout-Prediction"]
          	path = Patient-Dropout-Prediction
          	url = https://github.com/yisheng10/Patient-Dropout-Prediction.git
          [submodule "MyClinicalApp_AndroidAPK_5Jan2026_2138/MyClinicalApp2"]
          	path = MyClinicalApp_AndroidAPK_5Jan2026_2138/MyClinicalApp2
          	url = https://github.com/yisheng10/IDP_PatientApp.git
          EOF

      - name: Checkout dropout workspace
        uses: actions/checkout@v5
        with:
          repository: yisheng10/Patient-Dropout-Prediction
          token: ${{ secrets.DROPOUT_REPO_PAT }}
          path: Patient-Dropout-Prediction

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Missing secret: SUPABASE_URL"
            missing=1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Missing secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            missing=1
          fi

          if [ -z "${DROPOUT_REPO_PAT}" ]; then
            echo "Missing secret: DROPOUT_REPO_PAT"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify dropout workspace files
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          pwd
          ls -la
          required_files=(
            "requirements.txt"
            "src/publish_dropout_snapshots.py"
            "deploy_assets/data/triallight_subject_context_registry_v35subjectid.csv"
            "deploy_assets/checkpoints_candidate_024/model_stage_3_29_single.pth"
            "deploy_assets/checkpoints_candidate_024/artifacts_stage_3_29_single.pkl"
          )

          for target in "${required_files[@]}"; do
            if [ ! -f "$target" ]; then
              echo "Missing required file: $target"
              exit 1
            fi
          done

          if [ ! -d "deploy_assets/checkpoints_candidate_024" ]; then
            echo "Missing required directory: deploy_assets/checkpoints_candidate_024"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "./requirements.txt"

      - name: Preflight live dropout assets and secrets
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          python "./src/publish_dropout_snapshots.py" --preflight-only --source-mode live --limit-patients 5

      - name: Publish Firestore mirrors and Supabase snapshots
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          python "./src/publish_dropout_snapshots.py" --source-mode live
