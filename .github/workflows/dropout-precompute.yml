name: TrialLight Dropout Precompute

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  publish-dropout-snapshots:
    if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DROPOUT_DATA_PATH: Patient-Dropout-Prediction/deploy_assets/data/triallight_dropout_testing.csv
      DROPOUT_CHECKPOINTS_DIR: Patient-Dropout-Prediction/deploy_assets/checkpoints
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "Patient-Dropout-Prediction/requirements.txt"

      - name: Publish Firestore mirrors and Supabase snapshots
        run: python "Patient-Dropout-Prediction/src/publish_dropout_snapshots.py"
