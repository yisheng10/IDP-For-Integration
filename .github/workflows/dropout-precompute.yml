name: TrialLight Dropout Precompute

on:
  workflow_dispatch:
    inputs:
      limit_patients:
        description: "Optional patient scan limit for debugging"
        required: false
        type: number
      firebase_uids:
        description: "Optional Firebase UIDs to target. Commas, spaces, or new lines are all accepted."
        required: false
        type: string
      skip_testing_subject_sync:
        description: "Skip syncing dropout_testing_subjects during this run"
        required: false
        default: false
        type: boolean
      backfill_day_indices:
        description: "Optional comma-separated live day indices to backfill as Firestore history only, for example 1,2,3,4,5,6"
        required: false
        type: string
  schedule:
    # Run slightly before 19:00 Asia/Kuala_Lumpur to avoid GitHub's top-of-hour schedule congestion.
    - cron: "55 10 * * *"

jobs:
  publish-dropout-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DROPOUT_REPO_PAT: ${{ secrets.DROPOUT_REPO_PAT }}
      DROPOUT_LIVE_DEBUG: "1"
      TRIALLIGHT_SUBJECT_CONTEXT_REGISTRY_PATH: deploy_assets/data/triallight_subject_context_registry_v35subjectid.csv
      DROPOUT_CHECKPOINTS_DIR: deploy_assets/checkpoints_live_v2
      DROPOUT_LIVE_HISTORY_CONTEXT_DAYS: "30"
      DROPOUT_LIVE_STALENESS_CAP_DAYS: "30"
      DROPOUT_PROGRESS_EVERY: "5"
      DROPOUT_REQUIRE_SHADOW_MONITORING: "1"
      REQUIRED_FIREBASE_PROJECT_ID: "traillight-4750b"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Normalize submodule metadata for checkout cleanup
        shell: bash
        run: |
          cat > .gitmodules <<'EOF'
          [submodule "Patient-Dropout-Prediction"]
          	path = Patient-Dropout-Prediction
          	url = https://github.com/yisheng10/Patient-Dropout-Prediction.git
          [submodule "MyClinicalApp_AndroidAPK_5Jan2026_2138/MyClinicalApp2"]
          	path = MyClinicalApp_AndroidAPK_5Jan2026_2138/MyClinicalApp2
          	url = https://github.com/yisheng10/IDP_PatientApp.git
          EOF

      - name: Checkout dropout workspace
        uses: actions/checkout@v5
        with:
          repository: yisheng10/Patient-Dropout-Prediction
          token: ${{ secrets.DROPOUT_REPO_PAT }}
          ref: codex/candidate-024-disengagement-hardening
          path: Patient-Dropout-Prediction

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Missing secret: SUPABASE_URL"
            missing=1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Missing secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            missing=1
          fi

          if [ -z "${DROPOUT_REPO_PAT}" ]; then
            echo "Missing secret: DROPOUT_REPO_PAT"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Patient-Dropout-Prediction/requirements.txt

      - name: Verify dropout workspace files
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          pwd
          ls -la
          required_files=(
            "requirements.txt"
            "src/publish_dropout_snapshots.py"
            "deploy_assets/checkpoints_live_v2/model_stage_3_29_single.pth"
            "deploy_assets/checkpoints_live_v2/artifacts_stage_3_29_single.pkl"
          )

          for target in "${required_files[@]}"; do
            if [ ! -f "$target" ]; then
              echo "Missing required file: $target"
              exit 1
            fi
          done

          if [ ! -d "deploy_assets/checkpoints_live_v2" ]; then
            echo "Missing required directory: deploy_assets/checkpoints_live_v2"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          python -m pip install -r "./requirements.txt"

      - name: Preflight live dropout assets and secrets
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          LIMIT_PATIENTS="${{ github.event.inputs.limit_patients || '' }}"
          FIREBASE_UIDS="${{ github.event.inputs.firebase_uids || '' }}"
          SKIP_SYNC="${{ github.event.inputs.skip_testing_subject_sync || 'false' }}"
          args=(--preflight-only --source-mode live)

          if [ -n "$LIMIT_PATIENTS" ]; then
            args+=(--limit-patients "$LIMIT_PATIENTS")
          elif [ -z "$FIREBASE_UIDS" ]; then
            args+=(--limit-patients 5)
          fi

          if [ -n "$FIREBASE_UIDS" ]; then
            args+=(--firebase-uids "$FIREBASE_UIDS")
          fi

          if [ "$SKIP_SYNC" = "true" ]; then
            args+=(--skip-testing-subject-sync)
          fi

          python "./src/publish_dropout_snapshots.py" "${args[@]}"

      - name: Publish Firestore mirrors and Supabase snapshots
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          LIMIT_PATIENTS="${{ github.event.inputs.limit_patients || '' }}"
          FIREBASE_UIDS="${{ github.event.inputs.firebase_uids || '' }}"
          SKIP_SYNC="${{ github.event.inputs.skip_testing_subject_sync || 'false' }}"
          BACKFILL_DAY_INDICES="${{ github.event.inputs.backfill_day_indices || '' }}"
          args=(--source-mode live)

          if [ -n "$LIMIT_PATIENTS" ]; then
            args+=(--limit-patients "$LIMIT_PATIENTS")
          fi

          if [ -n "$FIREBASE_UIDS" ]; then
            args+=(--firebase-uids "$FIREBASE_UIDS")
          fi

          if [ "$SKIP_SYNC" = "true" ]; then
            args+=(--skip-testing-subject-sync)
          fi

          if [ -n "$BACKFILL_DAY_INDICES" ]; then
            args+=(--backfill-day-indices "$BACKFILL_DAY_INDICES")
          fi

          python "./src/publish_dropout_snapshots.py" "${args[@]}"

      - name: Evaluate shadow monitoring proxies
        working-directory: ./Patient-Dropout-Prediction
        shell: bash
        run: |
          FIREBASE_UIDS="${{ github.event.inputs.firebase_uids || '' }}"
          args=(--proxy-version proxy-v1 --window-days 7)

          if [ -n "$FIREBASE_UIDS" ]; then
            args+=(--firebase-uids "$FIREBASE_UIDS")
          fi

          python "./src/evaluate_shadow_proxies.py" "${args[@]}"
