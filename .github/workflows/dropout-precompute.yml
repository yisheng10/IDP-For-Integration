name: TrialLight Dropout Precompute

on:
  workflow_dispatch:
  schedule:
    # 03:00 Asia/Kuala_Lumpur = 19:00 UTC on the previous day.
    - cron: "0 19 * * *"

jobs:
  publish-dropout-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DROPOUT_REPO_PAT: ${{ secrets.DROPOUT_REPO_PAT }}
      DROPOUT_DATA_PATH: Patient-Dropout-Prediction/deploy_assets/data/triallight_dropout_testing_v35subjectid.csv
      DROPOUT_CHECKPOINTS_DIR: Patient-Dropout-Prediction/deploy_assets/checkpoints_honest_v3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout dropout workspace
        uses: actions/checkout@v5
        with:
          repository: yisheng10/Patient-Dropout-Prediction
          token: ${{ secrets.DROPOUT_REPO_PAT }}
          path: Patient-Dropout-Prediction

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Missing secret: SUPABASE_URL"
            missing=1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Missing secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            missing=1
          fi

          if [ -z "${DROPOUT_REPO_PAT}" ]; then
            echo "Missing secret: DROPOUT_REPO_PAT"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify dropout workspace files
        shell: bash
        run: |
          pwd
          ls -la
          ls -la "Patient-Dropout-Prediction"
          test -f "Patient-Dropout-Prediction/requirements.txt"
          test -f "Patient-Dropout-Prediction/src/publish_dropout_snapshots.py"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "./Patient-Dropout-Prediction/requirements.txt"

      - name: Preflight live dropout assets and secrets
        shell: bash
        run: |
          python "./Patient-Dropout-Prediction/src/publish_dropout_snapshots.py" --preflight-only --source-mode live --limit-patients 5

      - name: Publish Firestore mirrors and Supabase snapshots
        shell: bash
        run: |
          python "./Patient-Dropout-Prediction/src/publish_dropout_snapshots.py" --source-mode live
