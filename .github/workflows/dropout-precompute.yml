name: TrialLight Dropout Precompute

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  publish-dropout-snapshots:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DROPOUT_DATA_PATH: Patient-Dropout-Prediction/deploy_assets/data/triallight_dropout_testing_v35subjectid.csv
      DROPOUT_CHECKPOINTS_DIR: Patient-Dropout-Prediction/deploy_assets/checkpoints
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Missing secret: SUPABASE_URL"
            missing=1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "Missing secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Required GitHub Actions secrets are missing."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "Patient-Dropout-Prediction/requirements.txt"

      - name: Preflight live dropout assets and secrets
        run: python "Patient-Dropout-Prediction/src/publish_dropout_snapshots.py" --preflight-only --source-mode live --limit-patients 5

      - name: Publish Firestore mirrors and Supabase snapshots
        run: python "Patient-Dropout-Prediction/src/publish_dropout_snapshots.py" --source-mode live
